<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reel — local audio / video player</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%23FF4D12%22/><circle cx=%2250%22 cy=%2250%22 r=%2214%22 fill=%22%2317181A%22/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #edeae2;
    --panel: #ffffff;
    --panel-alt: #dfdbcf;
    --ink: #17181a;
    --ink-muted: #726f66;
    --line: #d7d2c4;
    --line-strong: #b7b1a0;
    --orange: #ff4d12;
    --orange-deep: #d43e0a;
    --lcd-bg: #1b1d17;
    --lcd-fg: #eef0e2;
    --lcd-fg-dim: rgba(238, 240, 226, 0.5);
    --radius-s: 8px;
    --radius-m: 13px;
    --radius-l: 20px;
    --font-display: 'Space Grotesk', 'Inter', sans-serif;
    --font-body: 'Inter', -apple-system, sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font-body); }
  button, input { font-family: inherit; color: inherit; }
  .hidden { display: none !important; }

  .app { display: flex; flex-direction: column; min-height: 100vh; }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 18px 26px; border-bottom: 1.5px solid var(--ink);
    background: var(--panel); flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 14px; }
  .mark {
    width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0;
    background-color: var(--panel-alt);
    background-image: radial-gradient(var(--line-strong) 1px, transparent 1.4px);
    background-size: 7px 7px; background-position: center;
    border: 1.5px solid var(--ink);
    display: flex; align-items: center; justify-content: center; position: relative;
  }
  .mark span {
    width: 12px; height: 12px; border-radius: 50%; background: var(--orange);
    display: block; box-shadow: 0 0 0 2px var(--ink);
  }
  .brand-text { display: flex; flex-direction: column; }
  .brand-top { display: flex; align-items: baseline; gap: 9px; }
  .brand h1 {
    font-family: var(--font-display); font-size: 21px; margin: 0; font-weight: 700;
    letter-spacing: 0.01em; text-transform: uppercase;
  }
  .model-tag {
    font-family: var(--font-mono); font-size: 10px; color: var(--ink-muted);
    border: 1px solid var(--line-strong); border-radius: 4px; padding: 1px 6px;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .brand p { margin: 3px 0 0; font-size: 12.5px; color: var(--ink-muted); }
  .storage-info {
    margin-top: 3px !important; font-family: var(--font-mono); font-size: 10.5px !important;
    color: var(--ink-muted) !important; text-transform: uppercase; letter-spacing: 0.03em;
  }
  .storage-info:not(:empty)::before { content: '● '; color: var(--orange); }
  .header-actions { display: flex; gap: 10px; }

  .btn {
    border: 1.5px solid var(--ink); background: var(--panel); color: var(--ink);
    padding: 10px 18px; border-radius: var(--radius-s); font-size: 13px; font-weight: 700; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.02em;
    display: inline-flex; align-items: center; gap: 8px; transition: transform 0.12s ease, background 0.12s ease;
  }
  .btn:hover { background: var(--panel-alt); }
  .btn:active { transform: scale(0.96); }
  .btn-primary { background: var(--orange); border-color: var(--ink); color: var(--ink); }
  .btn-primary:hover { background: #ff5f28; }

  .icon-btn {
    width: 34px; height: 34px; border-radius: 8px; border: 1.5px solid transparent; background: transparent;
    color: var(--ink-muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }
  .icon-btn:hover { background: var(--panel-alt); color: var(--ink); border-color: var(--line-strong); }
  .icon-btn:disabled { opacity: 0.3; cursor: default; pointer-events: none; }

  /* ---------- main ---------- */
  main { flex: 1; padding: 28px; max-width: 900px; width: 100%; margin: 0 auto; }

  .stage { margin: 0 0 22px; display: flex; justify-content: center; }
  .stage-frame {
    position: relative; background: var(--panel); border: 1.5px solid var(--ink); border-radius: var(--radius-m);
    padding: 10px; box-shadow: 0 10px 26px rgba(23, 24, 26, 0.14); width: 100%; max-width: 500px;
  }
  .stage-tag {
    position: absolute; top: -10px; left: 16px; background: var(--ink); color: var(--lcd-fg);
    font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 5px;
  }
  .stage video {
    display: block; width: 100%; max-height: 280px; border-radius: 7px; background: #000;
  }

  .drop-zone {
    background: var(--panel); border: 1.5px solid var(--ink); border-radius: var(--radius-l);
    padding: 54px 24px; text-align: center; cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .drop-zone:hover, .drop-zone.drag-over { border-color: var(--orange); }
  .drop-zone.drag-over { background: #fffaf7; }
  .dz-icon-badge {
    width: 62px; height: 62px; border-radius: 50%; margin: 0 auto 18px;
    border: 1.5px solid var(--ink); display: flex; align-items: center; justify-content: center;
    background-color: var(--panel-alt);
    background-image: radial-gradient(var(--line-strong) 1px, transparent 1.4px);
    background-size: 6px 6px; color: var(--ink);
  }
  .drop-zone h2 {
    font-family: var(--font-display); color: var(--ink); margin: 0 0 8px; font-size: 19px;
    text-transform: uppercase; letter-spacing: 0.01em;
  }
  .drop-zone .dz-caption {
    margin: 0 0 22px; font-size: 11.5px; color: var(--ink-muted); font-family: var(--font-mono);
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  .drop-zone .dz-buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }

  .queue-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
    color: var(--ink-muted); font-size: 11.5px; font-family: var(--font-mono);
    text-transform: uppercase; letter-spacing: 0.03em;
  }
  .clear-link {
    background: none; border: none; color: var(--ink-muted); font-size: 11.5px; cursor: pointer;
    font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.03em; padding: 0;
  }
  .clear-link:hover { color: var(--orange-deep); }
  .toast {
    position: fixed; left: 50%; bottom: 100px; transform: translateX(-50%) translateY(12px);
    background: var(--ink); border: 1.5px solid var(--ink); color: var(--lcd-fg);
    padding: 10px 18px; border-radius: var(--radius-s); font-family: var(--font-mono); font-size: 12px;
    text-transform: uppercase; letter-spacing: 0.02em;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; z-index: 50;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .queue-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .queue-row {
    display: grid; grid-template-columns: 24px 38px 1fr 34px; align-items: center; gap: 12px;
    padding: 9px 10px; border-radius: var(--radius-s); cursor: pointer;
    border-left: 3px solid transparent; transition: background 0.12s ease, border-color 0.12s ease;
  }
  .queue-row:hover { background: var(--panel); }
  .queue-row.playing { background: var(--panel); border-left-color: var(--orange); }
  .q-index {
    font-family: var(--font-mono); font-size: 12px; color: var(--line-strong); text-align: right; font-weight: 600;
  }
  .queue-row.playing .q-index { color: var(--orange-deep); }
  .q-icon {
    width: 38px; height: 38px; border-radius: 9px; background: var(--panel-alt); border: 1.5px solid var(--line-strong);
    display: flex; align-items: center; justify-content: center; color: var(--ink-muted); flex-shrink: 0;
  }
  .queue-row.playing .q-icon { border-color: var(--ink); color: var(--ink); background: #fff; }
  .q-main { min-width: 0; }
  .q-title { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q-sub {
    font-size: 11px; color: var(--ink-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.02em; margin-top: 1px;
  }
  .q-remove { justify-self: end; }

  .add-more-row { display: flex; justify-content: center; margin-top: 18px; }

  /* ---------- now playing footer ---------- */
  footer.now-playing {
    background: var(--panel); border-top: 1.5px solid var(--ink);
    display: grid; grid-template-columns: 260px 1fr 150px; align-items: center; gap: 22px;
    padding: 14px 26px; min-height: 84px;
  }
  .np-meta { display: flex; align-items: center; gap: 14px; min-width: 0; }

  .np-disc {
    width: 56px; height: 56px; border-radius: 50%; flex-shrink: 0; position: relative;
    background:
      repeating-conic-gradient(from 0deg, var(--line-strong) 0deg 1.5deg, transparent 1.5deg 15deg),
      var(--panel-alt);
    border: 1.5px solid var(--ink);
    display: flex; align-items: center; justify-content: center;
  }
  .np-disc::before {
    content: ''; position: absolute; inset: 9px; border-radius: 50%; background: var(--ink);
  }
  .np-disc-dot {
    width: 9px; height: 9px; border-radius: 50%; background: var(--orange); position: relative; z-index: 1;
  }
  .np-disc.spinning { animation: spin 4.5s linear infinite; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .np-screen {
    min-width: 0; flex: 1; background: var(--lcd-bg); border: 1.5px solid var(--ink); border-radius: 8px;
    padding: 7px 11px;
  }
  .np-title {
    font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; color: var(--lcd-fg);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; letter-spacing: 0.01em;
  }
  .np-sub {
    font-family: var(--font-mono); font-size: 10.5px; color: var(--lcd-fg-dim);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: uppercase; letter-spacing: 0.02em;
    margin-top: 2px;
  }

  .np-controls { display: flex; flex-direction: column; align-items: center; gap: 7px; min-width: 0; }
  .np-buttons { display: flex; align-items: center; gap: 8px; }
  .transport-pad {
    width: 38px; height: 38px; border-radius: 9px; border: 1.5px solid var(--ink); background: var(--panel);
    color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
    transition: background 0.12s ease;
  }
  .transport-pad:hover { background: var(--panel-alt); }
  .transport-pad:disabled { opacity: 0.3; cursor: default; pointer-events: none; }
  .play-btn {
    width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid var(--ink); cursor: pointer;
    background: var(--ink); color: var(--lcd-fg); display: flex; align-items: center; justify-content: center;
    transition: transform 0.12s ease;
  }
  .play-btn:hover { transform: scale(1.05); }
  .play-btn:disabled { opacity: 0.3; cursor: default; pointer-events: none; }
  .np-scrub { display: flex; align-items: center; gap: 10px; width: 100%; max-width: 480px; }
  .np-time {
    font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-muted); width: 32px; text-align: center; flex-shrink: 0;
  }

  input[type="range"] { -webkit-appearance: none; appearance: none; background: transparent; flex: 1; height: 16px; }
  input[type="range"]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: var(--line-strong); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 13px; height: 13px; border-radius: 4px;
    background: var(--ink); margin-top: -4.5px; cursor: pointer; box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--ink);
  }
  input[type="range"]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--line-strong); }
  input[type="range"]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 4px; border: 2px solid var(--panel); background: var(--ink); cursor: pointer;
  }
  input[type="range"]:disabled::-webkit-slider-thumb { background: var(--line-strong); box-shadow: none; }

  .np-vol { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
  .np-vol-label {
    font-family: var(--font-mono); font-size: 10px; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.04em;
  }
  .np-vol input { max-width: 84px; }

  @media (max-width: 720px) {
    footer.now-playing { grid-template-columns: 1fr auto; grid-template-areas: "meta vol" "controls controls"; row-gap: 12px; }
    .np-meta { grid-area: meta; }
    .np-vol { grid-area: vol; }
    .np-controls { grid-area: controls; }
    header { padding: 14px 16px; }
    main { padding: 18px 16px; }
  }
</style>
</head>
<body>
<div class="app">

  <header>
    <div class="brand">
      <span class="mark"><span></span></span>
      <div class="brand-text">
        <div class="brand-top">
          <h1>Reel</h1>
          <span class="model-tag">RL&#8209;01</span>
        </div>
        <p>Your library stays on this device — nothing is uploaded anywhere.</p>
        <p id="storageInfo" class="storage-info"></p>
      </div>
    </div>
    <div class="header-actions">
      <button id="addFilesBtn" class="btn">+ Files</button>
      <button id="addFolderBtn" class="btn btn-primary">+ Folder</button>
    </div>
  </header>

  <main id="main">
    <div id="stage" class="stage hidden">
      <div class="stage-frame">
        <span class="stage-tag">Video</span>
        <video id="videoEl" playsinline></video>
      </div>
    </div>

    <div id="dropZone" class="drop-zone">
      <div class="dz-icon-badge">
        <svg viewBox="0 0 24 24" width="26" height="26"><path fill="currentColor" d="M12 3l5 5h-3v6h-4V8H7l5-5Zm-7 14h14v2H5v-2Z"/></svg>
      </div>
      <h2>Drop songs, videos, or a folder</h2>
      <p class="dz-caption">MP3 · FLAC · WAV · M4A · OGG — MP4 · WEBM · MOV — stays on this browser</p>
      <div class="dz-buttons">
        <button class="btn btn-primary" id="dzFilesBtn">Choose files</button>
        <button class="btn" id="dzFolderBtn">Choose folder</button>
      </div>
    </div>

    <div id="queueWrap" class="hidden">
      <div class="queue-head">
        <span id="queueCount">0 tracks</span>
        <button id="clearLibraryBtn" class="clear-link">Clear library</button>
      </div>
      <ul id="queueList" class="queue-list"></ul>
      <div class="add-more-row">
        <button id="addMoreBtn" class="btn">+ Add more</button>
      </div>
    </div>
  </main>

  <footer class="now-playing">
    <div class="np-meta">
      <div class="np-disc" id="npDisc"><div class="np-disc-dot"></div></div>
      <div class="np-screen">
        <div class="np-title" id="npTitle">Nothing playing</div>
        <div class="np-sub" id="npSub">Add some music to get started</div>
      </div>
    </div>

    <div class="np-controls">
      <div class="np-buttons">
        <button id="prevBtn" class="transport-pad" title="Previous" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M6 6h2v12H6V6Zm3.5 6L18 6v12l-8.5-6Z"/></svg>
        </button>
        <button id="playBtn" class="play-btn" title="Play" disabled>
          <svg id="playIcon" viewBox="0 0 24 24" width="19" height="19"><path fill="currentColor" d="M8 5v14l11-7L8 5Z"/></svg>
          <svg id="pauseIcon" viewBox="0 0 24 24" width="19" height="19" class="hidden"><path fill="currentColor" d="M7 5h4v14H7V5Zm6 0h4v14h-4V5Z"/></svg>
        </button>
        <button id="nextBtn" class="transport-pad" title="Next" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M16 6h2v12h-2V6ZM6 6l8.5 6L6 18V6Z"/></svg>
        </button>
      </div>
      <div class="np-scrub">
        <span id="timeCurrent" class="np-time">0:00</span>
        <input id="seekBar" type="range" min="0" max="100" value="0" disabled />
        <span id="timeTotal" class="np-time">0:00</span>
      </div>
    </div>

    <div class="np-vol">
      <span class="np-vol-label">Vol</span>
      <input id="volumeBar" type="range" min="0" max="100" value="80" />
    </div>
  </footer>

  <audio id="audioEl"></audio>
  <input type="file" id="fileInput" accept="audio/*,video/*" multiple hidden />
  <input type="file" id="folderInput" webkitdirectory directory multiple hidden />
  <div id="toast" class="toast"></div>
</div>

<script>
(() => {
  const el = (id) => document.getElementById(id);

  const AUDIO_EXT = ['mp3','wav','ogg','m4a','flac','aac','wma','opus','weba'];
  const VIDEO_EXT = ['mp4','webm','mov','m4v','mkv','avi','ogv'];

  function classify(file) {
    if (file.type.startsWith('audio/')) return 'audio';
    if (file.type.startsWith('video/')) return 'video';
    const ext = (file.name.split('.').pop() || '').toLowerCase();
    if (AUDIO_EXT.includes(ext)) return 'audio';
    if (VIDEO_EXT.includes(ext)) return 'video';
    return null;
  }

  function niceName(filename) {
    const withoutExt = filename.replace(/\.[^/.]+$/, '');
    const parts = withoutExt.split(' - ');
    if (parts.length >= 2) {
      return { title: parts.slice(1).join(' - ').trim(), sub: parts[0].trim() };
    }
    return { title: withoutExt, sub: null };
  }

  function fmtTime(sec) {
    if (!Number.isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec / 60);
    const s = Math.floor(sec % 60).toString().padStart(2, '0');
    return `${m}:${s}`;
  }

  function noteIcon() {
    return `<svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M9 17V5l11-2v11.5A3.5 3.5 0 1 1 18 11V6.2l-7 1.3V17a3.5 3.5 0 1 1-2-3.2V17Z"/></svg>`;
  }
  function videoIcon() {
    return `<svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4Z"/></svg>`;
  }
  function closeIcon() {
    return `<svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19 12 13.4 17.6 19 19 17.6 13.4 12 19 6.4 17.6 5 12 10.6 6.4 5Z"/></svg>`;
  }

  // ---------- on-device storage (IndexedDB) ----------
  // Files are kept as real Blobs in the browser's own storage for this
  // origin. Nothing is ever sent anywhere - it just persists on this
  // device, in this browser, until you clear it.
  const DB_NAME = 'reel-player';
  const DB_STORE = 'tracks';
  let dbPromise = null;

  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      if (!window.indexedDB) return reject(new Error('IndexedDB unavailable'));
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = () => {
        const db = req.result;
        if (!db.objectStoreNames.contains(DB_STORE)) db.createObjectStore(DB_STORE, { keyPath: 'id' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
    return dbPromise;
  }
  async function dbGetAll() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readonly');
      const req = tx.objectStore(DB_STORE).getAll();
      req.onsuccess = () => resolve(req.result || []);
      req.onerror = () => reject(req.error);
    });
  }
  async function dbPut(record) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).put(record);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function dbDelete(id) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).delete(id);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }
  async function dbClear() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, 'readwrite');
      tx.objectStore(DB_STORE).clear();
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  function showToast(message) {
    const toast = el('toast');
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(showToast._t);
    showToast._t = setTimeout(() => toast.classList.remove('show'), 4000);
  }

  function fmtBytes(n) {
    if (!n) return '0 MB';
    const mb = n / (1024 * 1024);
    if (mb < 1024) return `${mb.toFixed(mb < 10 ? 1 : 0)} MB`;
    return `${(mb / 1024).toFixed(1)} GB`;
  }
  async function updateStorageInfo() {
    if (!navigator.storage || !navigator.storage.estimate) return;
    try {
      const { usage } = await navigator.storage.estimate();
      el('storageInfo').textContent = usage ? `${fmtBytes(usage)} stored on this device` : '';
    } catch {
      /* not critical */
    }
  }

  const queue = [];
  let currentIndex = -1;

  const audioEl = el('audioEl');
  const videoEl = el('videoEl');
  let activeEl = audioEl;

  function isDuplicate(file) {
    return queue.some((item) => item.file.name === file.name && item.file.size === file.size);
  }

  async function addToQueue(files) {
    let added = 0;
    let skippedDupes = 0;
    let storageFailed = false;

    for (const file of files) {
      const type = classify(file);
      if (!type) continue;
      if (isDuplicate(file)) { skippedDupes++; continue; }

      const { title, sub } = niceName(file.name);
      const id = `${Date.now()}-${added}-${Math.random().toString(36).slice(2, 7)}`;
      const record = { id, file, type, title, sub, addedAt: Date.now() };
      queue.push({ ...record, url: URL.createObjectURL(file) });
      added++;

      try {
        await dbPut(record);
      } catch {
        storageFailed = true;
      }
    }

    if (added > 0) {
      renderQueue();
      el('dropZone').classList.add('hidden');
      el('queueWrap').classList.remove('hidden');
      if (currentIndex === -1) playAt(queue.length - added);
      updateStorageInfo();
    }
    if (storageFailed) {
      showToast("This device is low on storage — some files may not be kept for next time.");
    } else if (skippedDupes > 0 && added === 0) {
      showToast(skippedDupes === 1 ? "That track is already in your library." : "Those tracks are already in your library.");
    }
    return added;
  }

  function renderQueue() {
    const list = el('queueList');
    list.innerHTML = '';
    el('queueCount').textContent = `${queue.length} track${queue.length === 1 ? '' : 's'}`;

    queue.forEach((item, idx) => {
      const row = document.createElement('div');
      row.className = 'queue-row' + (idx === currentIndex ? ' playing' : '');
      row.innerHTML = `
        <div class="q-index"></div>
        <div class="q-icon">${item.type === 'video' ? videoIcon() : noteIcon()}</div>
        <div class="q-main">
          <div class="q-title"></div>
          <div class="q-sub"></div>
        </div>
        <button class="icon-btn q-remove" title="Remove">${closeIcon()}</button>
      `;
      row.querySelector('.q-index').textContent = String(idx + 1).padStart(2, '0');
      row.querySelector('.q-title').textContent = item.title;
      row.querySelector('.q-sub').textContent = item.sub || (item.type === 'video' ? 'Video' : 'Audio');
      row.querySelector('.q-main').addEventListener('click', () => playAt(idx));
      row.querySelector('.q-icon').addEventListener('click', () => playAt(idx));
      row.querySelector('.q-remove').addEventListener('click', (e) => {
        e.stopPropagation();
        removeAt(idx);
      });
      list.appendChild(row);
    });
  }

  function removeAt(idx) {
    const wasPlaying = idx === currentIndex;
    const [removed] = queue.splice(idx, 1);
    URL.revokeObjectURL(removed.url);
    dbDelete(removed.id).catch(() => {});
    updateStorageInfo();

    if (!queue.length) {
      currentIndex = -1;
      stopPlayback();
      el('queueWrap').classList.add('hidden');
      el('dropZone').classList.remove('hidden');
      renderQueue();
      return;
    }

    if (idx < currentIndex) currentIndex--;
    else if (wasPlaying) {
      currentIndex = Math.min(idx, queue.length - 1);
      playAt(currentIndex);
      return;
    }
    renderQueue();
  }

  function stopPlayback() {
    audioEl.pause(); audioEl.removeAttribute('src'); audioEl.load();
    videoEl.pause(); videoEl.removeAttribute('src'); videoEl.load();
    el('stage').classList.add('hidden');
    el('npTitle').textContent = 'Nothing playing';
    el('npSub').textContent = 'Add some music to get started';
    el('npDisc').classList.remove('spinning');
    setTransportEnabled(false);
    el('seekBar').value = 0;
    el('timeCurrent').textContent = '0:00';
    el('timeTotal').textContent = '0:00';
  }

  function setTransportEnabled(on) {
    el('playBtn').disabled = !on;
    el('prevBtn').disabled = !on || queue.length < 2;
    el('nextBtn').disabled = !on || queue.length < 2;
    el('seekBar').disabled = !on;
  }

  function playAt(idx) {
    if (idx < 0 || idx >= queue.length) return;
    currentIndex = idx;
    const item = queue[idx];

    audioEl.pause();
    videoEl.pause();

    if (item.type === 'video') {
      activeEl = videoEl;
      videoEl.src = item.url;
      el('stage').classList.remove('hidden');
    } else {
      activeEl = audioEl;
      audioEl.src = item.url;
      el('stage').classList.add('hidden');
    }
    activeEl.volume = Number(el('volumeBar').value) / 100;
    activeEl.play().catch(() => {});

    el('npTitle').textContent = item.title;
    el('npSub').textContent = item.sub || (item.type === 'video' ? 'Video' : 'Audio');
    setTransportEnabled(true);
    renderQueue();
  }

  function playPause() {
    if (currentIndex === -1) return;
    if (activeEl.paused) activeEl.play().catch(() => {});
    else activeEl.pause();
  }

  function next() {
    if (!queue.length) return;
    playAt((currentIndex + 1) % queue.length);
  }
  function prev() {
    if (!queue.length) return;
    if (activeEl.currentTime > 3) { activeEl.currentTime = 0; return; }
    playAt((currentIndex - 1 + queue.length) % queue.length);
  }

  [audioEl, videoEl].forEach((mediaEl) => {
    mediaEl.addEventListener('play', () => {
      if (mediaEl !== activeEl) return;
      el('playIcon').classList.add('hidden');
      el('pauseIcon').classList.remove('hidden');
      el('npDisc').classList.toggle('spinning', mediaEl === audioEl);
    });
    mediaEl.addEventListener('pause', () => {
      if (mediaEl !== activeEl) return;
      el('playIcon').classList.remove('hidden');
      el('pauseIcon').classList.add('hidden');
      el('npDisc').classList.remove('spinning');
    });
    mediaEl.addEventListener('ended', () => { if (mediaEl === activeEl) next(); });
    mediaEl.addEventListener('timeupdate', () => {
      if (mediaEl !== activeEl || seeking) return;
      el('timeCurrent').textContent = fmtTime(mediaEl.currentTime);
      el('timeTotal').textContent = fmtTime(mediaEl.duration);
      if (mediaEl.duration) el('seekBar').value = String((mediaEl.currentTime / mediaEl.duration) * 100);
    });
  });

  let seeking = false;
  el('seekBar').addEventListener('input', () => { seeking = true; });
  el('seekBar').addEventListener('change', (e) => {
    if (activeEl.duration) activeEl.currentTime = (Number(e.target.value) / 100) * activeEl.duration;
    seeking = false;
  });
  el('volumeBar').addEventListener('input', (e) => {
    const v = Number(e.target.value) / 100;
    audioEl.volume = v;
    videoEl.volume = v;
  });
  audioEl.volume = 0.8; videoEl.volume = 0.8;

  el('playBtn').addEventListener('click', playPause);
  el('nextBtn').addEventListener('click', next);
  el('prevBtn').addEventListener('click', prev);

  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && currentIndex !== -1) { e.preventDefault(); playPause(); }
  });

  // ---------- file / folder pickers ----------
  el('fileInput').addEventListener('change', (e) => { addToQueue(e.target.files); e.target.value = ''; });
  el('folderInput').addEventListener('change', (e) => { addToQueue(e.target.files); e.target.value = ''; });

  const openFiles = () => el('fileInput').click();
  const openFolder = () => el('folderInput').click();
  el('addFilesBtn').addEventListener('click', openFiles);
  el('dzFilesBtn').addEventListener('click', openFiles);
  el('addFolderBtn').addEventListener('click', openFolder);
  el('dzFolderBtn').addEventListener('click', openFolder);
  el('addMoreBtn').addEventListener('click', openFiles);

  // ---------- drag & drop (files or whole folders) ----------
  async function readAllEntries(reader) {
    let all = [];
    while (true) {
      const batch = await new Promise((res, rej) => reader.readEntries(res, rej));
      if (!batch.length) break;
      all = all.concat(batch);
    }
    return all;
  }
  async function traverseEntry(entry, out) {
    if (entry.isFile) {
      const file = await new Promise((res, rej) => entry.file(res, rej));
      out.push(file);
    } else if (entry.isDirectory) {
      const entries = await readAllEntries(entry.createReader());
      for (const e of entries) await traverseEntry(e, out);
    }
  }
  async function filesFromDrop(dataTransfer) {
    const items = dataTransfer.items;
    if (!items || !items.length || !items[0].webkitGetAsEntry) {
      return Array.from(dataTransfer.files || []);
    }
    const out = [];
    const entries = Array.from(items).map((it) => it.webkitGetAsEntry()).filter(Boolean);
    for (const entry of entries) await traverseEntry(entry, out);
    return out;
  }

  const dropTarget = el('main');
  let dragDepth = 0;
  dropTarget.addEventListener('dragenter', (e) => {
    e.preventDefault();
    dragDepth++;
    el('dropZone').classList.add('drag-over');
  });
  dropTarget.addEventListener('dragover', (e) => e.preventDefault());
  dropTarget.addEventListener('dragleave', () => {
    dragDepth = Math.max(0, dragDepth - 1);
    if (dragDepth === 0) el('dropZone').classList.remove('drag-over');
  });
  dropTarget.addEventListener('drop', async (e) => {
    e.preventDefault();
    dragDepth = 0;
    el('dropZone').classList.remove('drag-over');
    const files = await filesFromDrop(e.dataTransfer);
    addToQueue(files);
  });

  el('clearLibraryBtn').addEventListener('click', async () => {
    if (!queue.length) return;
    const ok = window.confirm('Remove everything from your library on this device? This can\'t be undone.');
    if (!ok) return;
    queue.forEach((item) => URL.revokeObjectURL(item.url));
    queue.length = 0;
    currentIndex = -1;
    stopPlayback();
    el('queueWrap').classList.add('hidden');
    el('dropZone').classList.remove('hidden');
    renderQueue();
    try {
      await dbClear();
    } catch {
      showToast("Couldn't fully clear stored files - try again.");
    }
    updateStorageInfo();
  });

  window.addEventListener('beforeunload', () => {
    queue.forEach((item) => URL.revokeObjectURL(item.url));
  });

  // ---------- restore library saved on this device ----------
  (async function init() {
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(() => {});
    }
    try {
      const records = await dbGetAll();
      records.sort((a, b) => (a.addedAt || 0) - (b.addedAt || 0));
      for (const record of records) {
        queue.push({ ...record, url: URL.createObjectURL(record.file) });
      }
      if (queue.length) {
        el('dropZone').classList.add('hidden');
        el('queueWrap').classList.remove('hidden');
        renderQueue();
      }
    } catch {
      // IndexedDB unavailable (e.g. private browsing in some browsers) -
      // the app still works, it just won't remember between visits.
    }
    updateStorageInfo();
  })();
})();
</script>
</body>
</html>
